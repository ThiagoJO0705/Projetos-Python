<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Banco JAVER | Abra sua Conta</title>
        <link rel="stylesheet" href="../styles/global.css">
        <link rel="stylesheet" href="../styles/signup.css">
        <script src="../js/signup.js" defer></script>
</head>
<body>
    <div id="toast-container" class="toast-container"></div>

    <main class="signup-container">
        <section class="signup-card">
            <div class="signup-header">
                <div class="logo-wrapper">
                    <img src="../images/logo.png" alt="Logo Javer" class="main-logo">
                </div>
                <h1>ABRA SUA <span>CONTA</span></h1>
                <p>O banco feito para você evoluir.</p>
            </div>
            <form id="signup-form">
                <div class="form-scroll-area">
                    <div class="input-group">
                        <label for="name">Nome Completo</label>
                        <input type="text" id="name" placeholder="Ex: Thiago Oliveira">
                        <span class="field-error" id="name-error"></span>
                    </div>

                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" placeholder="seu@email.com">
                        <span class="field-error" id="email-error"></span>
                    </div>
                    <div class="input-row">
                        <div class="input-group">
                            <label for="cpf">CPF</label>
                            <input type="text" id="cpf" placeholder="00000000000" maxlength="11">
                            <span class="field-error" id="cpf-error"></span>
                        </div>
                        <div class="input-group">
                            <label for="phone">Telefone</label>
                            <input type="text" id="phone" placeholder="11999999999" maxlength="11">
                            <span class="field-error" id="phone-error"></span>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="password">Crie uma Senha</label>
                        <input type="password" id="password" placeholder="••••••••">
                        <span class="field-error" id="password-error"></span>
                    </div>
                </div>
                <button type="submit" id="btn-finalizar" class="btn-signup">Finalizar Cadastro</button>
            </form>
            <div class="signup-footer">
                <p>Já é de casa? <a href="index.html">Faça login</a></p>
            </div>
        </section>
    </main>
    
</body>
<div id="loading-overlay" class="loading-overlay">
    <div class="loader"></div>
</div>
</html>
