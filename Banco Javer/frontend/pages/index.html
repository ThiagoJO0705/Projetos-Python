<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco JAVER | Login</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/login.css">
    <script src="../js/login.js"></script>
</head>
<body>
    <div id="toast-container" class="toast-container"></div>
    <main class="login-container">
        <section class="login-card">
            <div class="login-header">
                <div class="logo-wrapper">
                    <img src="../images/logo.png" alt="Logo Javer" class="main-logo">
                </div>
                <h1>BANCO<span>JAVER</span></h1>
                <p>Acesse sua conta para gerenciar suas finanças.</p>
            </div>

            <form id="login-form" novalidate>
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                    <span class="field-error" id="email-error"></span>
                </div>

                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                    <span class="field-error" id="password-error"></span>
                </div>

                <div id="form-error" class="error-general"></div>

                <button type="submit" class="btn-login">Entrar</button>
            </form>

            <div class="login-footer">
                <p>Ainda não é correntista? <a href="signup.html">Abra sua conta</a></p>
            </div>
        </section>
    </main>
</body>
</html>
